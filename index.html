    <!-- Anti-flash dark mode initialization script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ndh-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#FAFAF5] text-[#111111] dark:bg-[#0F1115] dark:text-[#F3F4F6] font-['Be_Vietnam_Pro',sans-serif] min-h-screen antialiased selection:bg-[#FFD93D] selection:text-black">
